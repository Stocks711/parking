<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Parkplatz-Reservierung</title>
<style>
  :root{
    --bg:#f3f5f8; --card:#fff; --text:#1b2330; --muted:#6b7686; --line:#dde2ea;
    --accent:#0a5cd6; --free:#e8f6ec; --free-t:#1d6b36; --taken:#f1f2f5; --mine:#d6e6ff; --err:#b3261e; --ok:#1d6b36;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
  main{max-width:520px;margin:0 auto;padding:12px 12px 40px}
  h1{font-size:1.25rem;margin:8px 0 12px}
  h2{font-size:.85rem;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);margin:22px 4px 8px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px}
  label{display:block;font-size:.85rem;color:var(--muted);margin:0 0 4px}
  input{width:100%;font:inherit;font-size:16px;padding:11px 12px;border:1px solid var(--line);border-radius:8px;background:#fff;color:var(--text)}
  #kuerzel{text-transform:uppercase;font-weight:600;letter-spacing:.05em}
  .row{display:flex;gap:10px;margin-top:12px}
  .row>div{flex:1;min-width:0}
  button{font:inherit;font-weight:600;border:0;border-radius:8px;padding:12px 14px;cursor:pointer}
  button:disabled{opacity:.5}
  .primary{background:var(--accent);color:#fff;width:100%;margin-top:14px}
  .secondary{background:#fff;color:var(--err);border:1px solid var(--line);width:100%;margin-top:8px}
  #msg{margin-top:12px;font-size:.92rem;min-height:1.2em;white-space:pre-line}
  #msg.err{color:var(--err)} #msg.ok{color:var(--ok)}
  #banner{background:#fff4d6;border:1px solid #ecd48a;color:#6a5200;border-radius:8px;padding:8px 10px;font-size:.82rem;margin-bottom:10px}
  .day{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:8px}
  .day.today{border-color:var(--accent)}
  .dayhead{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:8px;cursor:pointer}
  .dayhead b{font-size:1rem}
  .dayhead span{font-size:.8rem;color:var(--muted)}
  .spots{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
  .spot{border-radius:8px;padding:6px 2px;text-align:center;background:var(--taken);min-height:52px;display:flex;flex-direction:column;justify-content:center}
  .spot small{display:block;font-size:.7rem;color:var(--muted)}
  .spot strong{font-size:.95rem;word-break:break-all}
  .spot.free{background:var(--free)} .spot.free strong{color:var(--free-t);font-weight:500;font-size:.85rem}
  .spot.mine{background:var(--mine);outline:2px solid var(--accent);cursor:pointer}
  .mine-item{display:flex;justify-content:space-between;align-items:center;padding:9px 0;border-bottom:1px solid var(--line)}
  .mine-item:last-child{border:0}
  .mine-item button{background:#fff;color:var(--err);border:1px solid var(--line);padding:7px 10px;font-size:.85rem}
  .empty{color:var(--muted);font-size:.92rem}
</style>
</head>
<body>
<main>
  <h1>🅿️ Parkplatz-Reservierung</h1>
  <div id="banner" hidden></div>

  <section class="card">
    <label for="kuerzel">Dein Kürzel</label>
    <input id="kuerzel" maxlength="6" autocomplete="off" autocapitalize="characters" placeholder="z. B. MUE">

    <div class="row">
      <div><label for="von">Von</label><input type="date" id="von"></div>
      <div><label for="bis">Bis</label><input type="date" id="bis"></div>
    </div>

    <button class="primary" id="btnBook">Parkplatz reservieren</button>
    <button class="secondary" id="btnCancelRange">Zeitraum stornieren</button>
    <div id="msg" role="status" aria-live="polite"></div>
  </section>

  <h2>Meine Reservierungen</h2>
  <section class="card" id="mine"></section>

  <h2>Übersicht</h2>
  <div id="days"></div>
</main>

<script>
/* ==================== EINSTELLUNGEN ==================== */

// Firebase-Konfiguration hier einfügen (siehe README.md).
// Solange hier "null" steht, läuft die Seite im Demo-Modus (Daten nur auf diesem Gerät).
const FIREBASE_CONFIG = null;
/* Beispiel:
const FIREBASE_CONFIG = {
  apiKey: "...", authDomain: "...", projectId: "...",
  storageBucket: "...", messagingSenderId: "...", appId: "..."
};
*/

// Optional: nur diese Kürzel dürfen buchen (Großbuchstaben). Leer = jedes Kürzel erlaubt.
const ERLAUBTE_KUERZEL = [];   // z. B. ["ABC","MUE","SCH"]

const SPOTS = [
  {id:"34",   label:"34"},
  {id:"36",   label:"36"},
  {id:"Pal1", label:"Pal 1"},
  {id:"Pal2", label:"Pal 2"}
];

/* ==================== HILFSFUNKTIONEN ==================== */

const $ = id => document.getElementById(id);
const DAY_NAMES = ["So","Mo","Di","Mi","Do","Fr","Sa"];
const pad = n => String(n).padStart(2,"0");
const iso = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const fromIso = s => { const [y,m,d] = s.split("-").map(Number); return new Date(y,m-1,d,12); };
const nice = s => { const d = fromIso(s); return `${DAY_NAMES[d.getDay()]} ${pad(d.getDate())}.${pad(d.getMonth()+1)}.`; };
const spotLabel = id => (SPOTS.find(s => s.id === id) || {label:id}).label;

const now = new Date();
const TODAY = new Date(now.getFullYear(), now.getMonth(), now.getDate(), 12);
const monday = new Date(TODAY); monday.setDate(TODAY.getDate() - ((TODAY.getDay() + 6) % 7));
const WINDOW_END = new Date(monday); WINDOW_END.setDate(monday.getDate() + 20);   // Sonntag der Folgewoche
const TODAY_ISO = iso(TODAY), END_ISO = iso(WINDOW_END);

function workdaysBetween(fromS, toS){
  const out = [];
  for (let d = fromIso(fromS); iso(d) <= toS; d.setDate(d.getDate()+1)){
    if (d.getDay() !== 0 && d.getDay() !== 6) out.push(iso(d));
  }
  return out;
}

let state = { data:{}, backend:null, busy:false };

function say(text, type){ const m = $("msg"); m.textContent = text || ""; m.className = type || ""; }

/* ==================== SPEICHER: LOKAL (DEMO) ==================== */

function createLocalBackend(){
  const KEY = "parkplatz_demo_v1";
  let listener = null;
  const load = () => { try { return JSON.parse(localStorage.getItem(KEY)) || {}; } catch(e){ return {}; } };
  const save = d => { localStorage.setItem(KEY, JSON.stringify(d)); if (listener) listener(load()); };
  window.addEventListener("storage", e => { if (e.key === KEY && listener) listener(load()); });
  return {
    mode:"demo",
    subscribe(cb){ listener = cb; cb(load()); },
    async reserve(date, k, pref){
      const d = load();
      if (SPOTS.some(s => d[`${date}_${s.id}`] && d[`${date}_${s.id}`].kuerzel === k)) return {status:"dup"};
      const free = SPOTS.filter(s => !d[`${date}_${s.id}`]).map(s => s.id);
      if (!free.length) return {status:"full"};
      const spot = free.includes(pref) ? pref : free[0];
      d[`${date}_${spot}`] = {date, spot, kuerzel:k, created:Date.now()};
      save(d);
      return {status:"ok", spot};
    },
    async cancel(date, spot, k){
      const d = load(), key = `${date}_${spot}`;
      if (d[key] && d[key].kuerzel === k){ delete d[key]; save(d); }
    }
  };
}

/* ==================== SPEICHER: FIREBASE (ECHTER BETRIEB) ==================== */

async function createFirebaseBackend(){
  const base = "https://www.gstatic.com/firebasejs/10.14.1/";
  const [appMod, fs] = await Promise.all([
    import(base + "firebase-app.js"),
    import(base + "firebase-firestore.js")
  ]);
  const db = fs.getFirestore(appMod.initializeApp(FIREBASE_CONFIG));
  const col = fs.collection(db, "reservations");
  return {
    mode:"online",
    subscribe(cb){
      const q = fs.query(col, fs.where("date", ">=", TODAY_ISO));
      fs.onSnapshot(q,
        snap => { const m = {}; snap.forEach(d => m[d.id] = d.data()); cb(m); },
        err => say("Verbindungsfehler: " + err.message, "err"));
    },
    async reserve(date, k, pref){
      return fs.runTransaction(db, async tx => {
        const refs  = SPOTS.map(s => fs.doc(db, "reservations", `${date}_${s.id}`));
        const snaps = await Promise.all(refs.map(r => tx.get(r)));
        if (snaps.some(s => s.exists() && s.data().kuerzel === k)) return {status:"dup"};
        const freeIdx = snaps.map((s,i) => s.exists() ? -1 : i).filter(i => i >= 0);
        if (!freeIdx.length) return {status:"full"};
        const prefIdx = SPOTS.findIndex(s => s.id === pref);
        const i = freeIdx.includes(prefIdx) ? prefIdx : freeIdx[0];
        tx.set(refs[i], {date, spot:SPOTS[i].id, kuerzel:k, created:Date.now()});
        return {status:"ok", spot:SPOTS[i].id};
      });
    },
    async cancel(date, spot, k){
      const ref = fs.doc(db, "reservations", `${date}_${spot}`);
      await fs.runTransaction(db, async tx => {
        const s = await tx.get(ref);
        if (s.exists() && s.data().kuerzel === k) tx.delete(ref);
      });
    }
  };
}

/* ==================== LOGIK ==================== */

function getKuerzel(){
  const k = $("kuerzel").value.trim().toUpperCase();
  if (!/^[A-ZÄÖÜ0-9]{2,6}$/.test(k)){ say("Bitte gültiges Kürzel eingeben (2–6 Zeichen).", "err"); return null; }
  if (ERLAUBTE_KUERZEL.length && !ERLAUBTE_KUERZEL.includes(k)){ say("Dieses Kürzel ist nicht freigeschaltet.", "err"); return null; }
  try { localStorage.setItem("parkplatz_kuerzel", k); } catch(e){}
  $("kuerzel").value = k;
  return k;
}

function getRange(){
  const von = $("von").value, bis = $("bis").value;
  if (!von || !bis){ say("Bitte Zeitraum wählen.", "err"); return null; }
  if (von > bis){ say("„Von“ darf nicht nach „Bis“ liegen.", "err"); return null; }
  if (von < TODAY_ISO || bis > END_ISO){ say("Reservierung nur bis zur Folgewoche möglich.", "err"); return null; }
  const days = workdaysBetween(von, bis);
  if (!days.length){ say("Im Zeitraum liegen nur Wochenendtage.", "err"); return null; }
  return days;
}

function myEntries(k){
  return Object.values(state.data).filter(e => e.kuerzel === k && e.date >= TODAY_ISO)
         .sort((a,b) => a.date.localeCompare(b.date));
}

async function withBusy(fn){
  if (state.busy) return;
  state.busy = true; document.querySelectorAll("button").forEach(b => b.disabled = true);
  try { await fn(); }
  catch(e){ say("Fehler: " + (e.message || e), "err"); }
  finally { state.busy = false; document.querySelectorAll("button").forEach(b => b.disabled = false); }
}

async function book(){
  const k = getKuerzel(); if (!k) return;
  const days = getRange(); if (!days) return;
  await withBusy(async () => {
    say("Reserviere …");
    const ok = [], dup = [], full = [];
    let pref = null;
    for (const day of days){
      const r = await state.backend.reserve(day, k, pref);
      if (r.status === "ok"){ ok.push(`${nice(day)} → Platz ${spotLabel(r.spot)}`); pref = r.spot; }
      else if (r.status === "dup") dup.push(nice(day));
      else full.push(nice(day));
    }
    let t = "";
    if (ok.length)   t += `✔ Reserviert:\n${ok.join("\n")}\n`;
    if (dup.length)  t += `Schon reserviert: ${dup.join(", ")}\n`;
    if (full.length) t += `✖ Alles belegt: ${full.join(", ")}`;
    say(t.trim(), full.length && !ok.length ? "err" : "ok");
  });
}

async function cancelRange(){
  const k = getKuerzel(); if (!k) return;
  const days = getRange(); if (!days) return;
  const mine = myEntries(k).filter(e => days.includes(e.date));
  if (!mine.length){ say("Im Zeitraum hast du keine Reservierung.", "err"); return; }
  if (!confirm(`${mine.length} Reservierung(en) von ${k} stornieren?`)) return;
  await withBusy(async () => {
    for (const e of mine) await state.backend.cancel(e.date, e.spot, k);
    say(`✔ ${mine.length} Reservierung(en) storniert.`, "ok");
  });
}

async function cancelOne(date, spot){
  const k = getKuerzel(); if (!k) return;
  await withBusy(async () => {
    await state.backend.cancel(date, spot, k);
    say(`✔ ${nice(date)} (Platz ${spotLabel(spot)}) storniert.`, "ok");
  });
}

/* ==================== ANZEIGE ==================== */

function render(){
  const k = $("kuerzel").value.trim().toUpperCase();

  // Meine Reservierungen
  const mineBox = $("mine"); mineBox.textContent = "";
  const mine = k ? myEntries(k) : [];
  if (!mine.length){
    const p = document.createElement("div"); p.className = "empty";
    p.textContent = k ? "Keine anstehenden Reservierungen." : "Kürzel eingeben, um deine Reservierungen zu sehen.";
    mineBox.appendChild(p);
  } else {
    for (const e of mine){
      const row = document.createElement("div"); row.className = "mine-item";
      const t = document.createElement("span"); t.textContent = `${nice(e.date)} – Platz ${spotLabel(e.spot)}`;
      const b = document.createElement("button"); b.textContent = "Stornieren";
      b.onclick = () => cancelOne(e.date, e.spot);
      row.append(t, b); mineBox.appendChild(row);
    }
  }

  // Tagesübersicht
  const box = $("days"); box.textContent = "";
  const weekNames = ["Diese Woche","Nächste Woche","Folgewoche"];
  let lastWeek = -1;
  for (const day of workdaysBetween(TODAY_ISO, END_ISO)){
    const w = Math.floor((fromIso(day) - monday) / (7*864e5));
    if (w !== lastWeek){
      const h = document.createElement("h2"); h.textContent = weekNames[w]; box.appendChild(h); lastWeek = w;
    }
    const card = document.createElement("div"); card.className = "day" + (day === TODAY_ISO ? " today" : "");
    const head = document.createElement("div"); head.className = "dayhead";
    const used = SPOTS.filter(s => state.data[`${day}_${s.id}`]).length;
    const b = document.createElement("b"); b.textContent = nice(day);
    const sp = document.createElement("span"); sp.textContent = `${SPOTS.length - used} von ${SPOTS.length} frei`;
    head.append(b, sp);
    head.onclick = () => { $("von").value = day; $("bis").value = day; window.scrollTo({top:0, behavior:"smooth"}); };
    card.appendChild(head);

    const grid = document.createElement("div"); grid.className = "spots";
    for (const s of SPOTS){
      const e = state.data[`${day}_${s.id}`];
      const cell = document.createElement("div");
      const lab = document.createElement("small"); lab.textContent = s.label;
      const val = document.createElement("strong");
      if (!e){ cell.className = "spot free"; val.textContent = "frei"; }
      else {
        val.textContent = e.kuerzel;
        if (k && e.kuerzel === k){
          cell.className = "spot mine"; cell.title = "Tippen zum Stornieren";
          cell.onclick = () => { if (confirm(`${nice(day)} Platz ${s.label} stornieren?`)) cancelOne(day, s.id); };
        } else cell.className = "spot";
      }
      cell.append(lab, val); grid.appendChild(cell);
    }
    card.appendChild(grid); box.appendChild(card);
  }
}

/* ==================== START ==================== */

async function init(){
  // Standardzeitraum: heute (oder nächster Werktag)
  let start = new Date(TODAY);
  while (start.getDay() === 0 || start.getDay() === 6) start.setDate(start.getDate()+1);
  for (const id of ["von","bis"]){ $(id).min = TODAY_ISO; $(id).max = END_ISO; $(id).value = iso(start); }
  $("von").onchange = () => { if ($("bis").value < $("von").value) $("bis").value = $("von").value; };
  $("bis").onchange = () => { if ($("bis").value < $("von").value) $("von").value = $("bis").value; };

  try { $("kuerzel").value = localStorage.getItem("parkplatz_kuerzel") || ""; } catch(e){}
  $("kuerzel").addEventListener("input", render);
  $("btnBook").onclick = book;
  $("btnCancelRange").onclick = cancelRange;

  try {
    state.backend = FIREBASE_CONFIG ? await createFirebaseBackend() : createLocalBackend();
  } catch(e){
    say("Datenbank nicht erreichbar: " + e.message, "err");
    state.backend = createLocalBackend();
  }
  if (state.backend.mode === "demo"){
    const bn = $("banner"); bn.hidden = false;
    bn.textContent = "Demo-Modus: Daten werden nur auf diesem Gerät gespeichert. Für alle Kolleg:innen bitte Firebase einrichten (siehe README).";
  }
  state.backend.subscribe(d => { state.data = d; render(); });
  render();
}
init();
</script>
</body>
</html>
